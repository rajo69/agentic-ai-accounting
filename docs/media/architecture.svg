      .label { fill: #ebebf0; font: 500 14px ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: #92939d; font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
