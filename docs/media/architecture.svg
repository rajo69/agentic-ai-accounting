<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Next.js on Vercel talks to FastAPI on Railway, which runs LangGraph graphs calling Claude through Instructor, stores the books, pgvector precedents and the audit log in Postgres, and syncs Xero through OAuth2.">
